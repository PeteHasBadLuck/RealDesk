name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-static-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s Dockerfile
          test -s docker-compose.yml
          test -s docs/DEPLOYMENT.md
      - name: Check HTML has expected app landmarks
        run: |
          grep -q '<title>RealDesk' index.html
          grep -q 'id="lead-form"' index.html
          grep -q 'id="export-btn"' index.html
