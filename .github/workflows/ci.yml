name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace apps/api run db:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npm --workspace apps/api run build
      - run: npm --workspace apps/web run build      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t realdesk-api:test .
      - name: Build web container
        run: docker build -f apps/web/Dockerfile -t realdesk-web:test .
